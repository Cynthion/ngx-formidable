name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run prettier:check

      - name: Lint
        run: npm run lint

      - name: Lint Styles
        run: npm run style-lint

      # The portal's token manifest transcribes `user/theme-reference.md`; this is what stops it drifting.
      - name: Check Token Descriptions
        run: npm run docs:check

      - name: Lint Markdown
        run: npm run docs:lint

      # The library build is also the type and template check — there is no standalone typecheck script.
      - name: Build Library
        run: npm run build:lib

      - name: Test Library
        run: npm test -- ngx-formidable --watch=false --browsers=ChromeHeadless

      - name: Test Portal
        run: npm test -- ngx-formidable-portal --watch=false --browsers=ChromeHeadless

      - name: Build Portal
        run: npm run build
