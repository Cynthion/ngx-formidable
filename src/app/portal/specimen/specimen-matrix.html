<div
  class="matrix"
  [style.grid-template-columns]="template()">
  @for (column of columns(); track column.title) {
  <code class="column-name">{{ column.title }}</code>
  } @for (row of rows(); track row.kind) {
  <a
    class="row-name"
    [routerLink]="row.link"
    [title]="'The reference for ' + row.selector">
    <span>{{ row.label }}</span>
    <code>{{ row.selector }}</code>
  </a>

  @for (cell of row.cells; track $index) {
  <portal-specimen-cell
    class="cell"
    [spec]="cell.spec"
    [formOptions]="formOptions"
    [value]="cell.value"
    [invalid]="cell.invalid" />
  } }
</div>

@if (hiddenCount() > 0) {
<button
  type="button"
  class="more"
  [attr.aria-expanded]="expanded()"
  (click)="expanded.set(!expanded())">
  @if (expanded()) { Show {{ featured().length }} fields } @else { Show all {{ kinds().length }} fields }
</button>
}
