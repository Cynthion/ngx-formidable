<portal-sub-tabs
  ariaLabel="Form sections"
  [tabs]="subTabs"
  [active]="inspector.formTab()"
  [strapline]="straplines[inspector.formTab()]"
  (selected)="select($event)" />

@switch (inspector.formTab()) {
  @case ('fields') {
    <portal-fields-tab />
  }
  @case ('structure') {
    <portal-structure-tab />
  }
}
