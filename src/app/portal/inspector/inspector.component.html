@if (!layout.inspectorCollapsed()) {
  <div
    portalResizeHandle
    axis="x"
    handleLabel="Resize the inspector"
    class="divider"
    (moved)="onDividerMoved($event)"
    (nudged)="onDividerNudged($event)"
    (resetRequested)="layout.resetInspectorWidth()"></div>
}

<header class="head">
  <div class="title-row">
    <span class="title">Inspector</span>
    <button
      type="button"
      class="collapse"
      [attr.aria-label]="layout.inspectorCollapsed() ? 'Expand the inspector' : 'Collapse the inspector'"
      [title]="layout.inspectorCollapsed() ? 'Expand' : 'Collapse'"
      (click)="toggle()">
      {{ layout.inspectorCollapsed() ? '‹' : '›' }}
    </button>
  </div>

  @if (!layout.inspectorCollapsed()) {
    <nav
      role="tablist"
      class="tabs"
      aria-label="Inspector">
      @for (entry of tabs; track entry.id) {
        <button
          type="button"
          role="tab"
          class="tab"
          [class.active]="store.tab() === entry.id"
          [attr.aria-selected]="store.tab() === entry.id"
          [title]="entry.title"
          (click)="store.tab.set(entry.id)">
          {{ entry.label }}
        </button>
      }
    </nav>
  }
</header>

@if (!layout.inspectorCollapsed()) {
  <div class="body">
    @switch (store.tab()) {
      @case ('theme') {
        <portal-theme-tab />
      }
      @case ('form') {
        <portal-form-tab />
      }
      @case ('export') {
        <portal-export-tab />
      }
    }
  </div>
}
