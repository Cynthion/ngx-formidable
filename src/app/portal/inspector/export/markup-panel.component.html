<portal-accordion
  heading="Export"
  lede="The Angular template this configuration produces. A production build contains no template compiler, so the configuration is the source and this is derived from it — which is why it is read-only."
  [hint]="fieldCount() + ' Fields'"
  [open]="isOpen('export')"
  (toggled)="toggle('export')">
  <pre class="markup">{{ markup() }}</pre>

  <div class="pc-buttons">
    <button
      type="button"
      class="pc-button is-primary"
      (click)="copy()">
      {{ justCopied() ? 'Copied' : 'Copy Markup' }}
    </button>
    <button
      type="button"
      class="pc-button is-quiet"
      (click)="store.reset()">
      Reset Markup
    </button>
  </div>
</portal-accordion>

<portal-accordion
  heading="Import"
  lede="A whole form, read back in. It replaces the one on the stage, sections included — those come from the comments above each run of fields. A static, attribute-only subset: bindings to expressions and control flow are listed rather than silently dropped."
  hint="Paste A Form"
  [open]="isOpen('import')"
  (toggled)="toggle('import')">
  <textarea
    rows="4"
    spellcheck="false"
    placeholder="<form formidableForm> … </form>"
    class="pc-textarea"
    [value]="importText()"
    (input)="importText.set($any($event.target).value)"></textarea>

  <div class="pc-buttons">
    <button
      type="button"
      class="pc-button is-primary"
      [disabled]="!importText().trim()"
      (click)="runImport()">
      Replace The Form
    </button>
  </div>

  @if (importResult(); as result) {
    <div class="report">
      <p class="applied">Read {{ result.fields.length }} fields in {{ result.sections.length }} sections.</p>
      @if (result.notes.length) {
        <p class="notes-head">Ignored:</p>
        <ul class="notes">
          @for (note of result.notes; track $index) {
            <li>
              <code class="pc-code">{{ note.text }}</code>
              <span class="reason">{{ noteLabels[note.reason] }}</span>
            </li>
          }
        </ul>
      }
    </div>
  }
</portal-accordion>
