@if (file().id === 'theme') {
<div class="options">
  <label class="pc-check">
    <input
      type="radio"
      name="export-format"
      [checked]="theme.exportOptions().format === 'css'"
      (change)="setFormat('css')" />
    CSS
  </label>
  <label class="pc-check">
    <input
      type="radio"
      name="export-format"
      [checked]="theme.exportOptions().format === 'scss'"
      (change)="setFormat('scss')" />
    SCSS
  </label>
  <label class="pc-check">
    <input
      type="checkbox"
      [checked]="theme.exportOptions().includeComments"
      (change)="setIncludeComments($any($event.target).checked)" />
    Comments
  </label>
  <label class="pc-check">
    <input
      type="checkbox"
      [checked]="theme.exportOptions().includePageSurface"
      (change)="setIncludePageSurface($any($event.target).checked)" />
    Page Surface
  </label>
  <label class="pc-check">
    <input
      type="checkbox"
      [checked]="theme.exportOptions().includeDefaults"
      (change)="setIncludeDefaults($any($event.target).checked)" />
    Explicit Defaults
  </label>
</div>
}

<div class="doc-code">
  <div class="doc-code-bar">
    {{ fileName() }}
    <button
      type="button"
      class="doc-code-copy"
      [class.is-copied]="justCopied()"
      [attr.aria-label]="justCopied() ? 'Copied' : 'Copy ' + file().label"
      [title]="justCopied() ? 'Copied' : 'Copy ' + file().label"
      (click)="copy()">
      <example-icon
        [svg]="justCopied() ? copiedSvg : copySvg"
        [size]="14" />
    </button>
  </div>
  <pre
    class="preview"
    [innerHTML]="highlighted()"></pre>
</div>
