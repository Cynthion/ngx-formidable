@if (!total()) {
  <p class="pc-help">No fields yet. Add one under <strong>Structure</strong>.</p>
} @else {
  @for (control of controls; track control.id) {
    @let state = stateOf(control);

    <div class="pc-field">
      <label
        class="pc-label"
        [for]="'ae-' + control.id">
        <span class="pc-label-name">{{ control.label }}</span>
      </label>
      <select
        class="pc-select"
        [id]="'ae-' + control.id"
        [portalSelectedValue]="state.value"
        (change)="apply(control, $any($event.target).value)">
        @for (choice of choices; track choice[0]) {
          <option [value]="choice[0]">{{ choice[1] }}</option>
        }
      </select>

      @if (state.overrides) {
        <p class="pc-overrides">
          <span>{{ state.overrides }} of {{ total() }} fields override this.</span>
          <button
            type="button"
            class="pc-reset"
            (click)="apply(control, state.value)">
            Apply To All
          </button>
        </p>
      }
    </div>
  }
}
