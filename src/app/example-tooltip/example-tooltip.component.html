<span
  class="tooltip-host"
  [attr.data-placement]="placement()"
  (mouseenter)="onEnter()"
  (mouseleave)="onLeave()">
  <button
    type="button"
    class="tooltip-trigger"
    aria-label="Help"
    (click)="trigger() === 'click' && toggle()">
    <example-icon
      [svg]="icon()"
      [size]="32" />
  </button>

  <div
    role="tooltip"
    tabindex="-1"
    class="tooltip-panel"
    [class.open]="open()">
    @if (text()) {
      {{ text() }}
    } @else {
      <ng-content></ng-content>
    }
    <span
      class="tooltip-arrow"
      aria-hidden="true"></span>
  </div>
</span>
