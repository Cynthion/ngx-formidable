<div
  ngClass="field-option-{{ layout }}"
  [class.is-readonly]="readonly"
  [class.is-disabled]="disabled"
  [class.is-selected]="selected"
  [class.is-highlighted]="highlighted"
  (click)="onClick()">
  <!-- Option Prefix for Radio Group -->
  @if (layout === 'radio-group') {
    <span class="field-option-prefix">
      <span class="radio-outer">
        @if (selected) {
          <span class="radio-inner"></span>
        }
      </span>
    </span>
  }

  <!-- Option Prefix for Checkbox Group -->
  @if (layout === 'checkbox-group') {
    <span class="field-option-prefix">
      <span class="checkbox-outer">
        @if (selected) {
          <span class="checkbox-inner"></span>
        }
      </span>
    </span>
  }

  <!-- Content -->
  <div class="content">
    <!-- captures the content projection inside a template reference for later export -->
    <ng-template #contentTemplate>
      <ng-content></ng-content>
    </ng-template>

    @if (hasContent) {
      <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
    } @else {
      {{ label ?? value }}
    }
  </div>
</div>
