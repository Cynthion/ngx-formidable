<div
  #radioGroupRef
  role="radiogroup"
  class="field"
  [class.is-readonly]="readonly()"
  [class.is-disabled]="disabled()"
  [tabindex]="canEdit() ? null : -1"
  [attr.aria-labelledby]="labelledBy"
  [attr.aria-required]="required() || null"
  [attr.aria-invalid]="showErrors() || null"
  [attr.aria-describedby]="describedBy"
  [attr.aria-readonly]="readonly() || null"
  [attr.aria-disabled]="disabled() || null"
  [attr.aria-activedescendant]="optionId(highlightedOptionIndex())"
  (focus)="onFocusChange(true)"
  (blur)="onFocusChange(false)">
  <!-- Options -->
  <!-- Options are re-created in order to use native <input> elements. -->
  @for (option of activeOptions(); track option.value; let i = $index) {
  <input
    hidden
    type="radio"
    [tabindex]="-1"
    [attr.name]="name()"
    [attr.readonly]="option.readonly || readonly() ? '' : null"
    [attr.disabled]="option.disabled || disabled() ? '' : null"
    [checked]="option.value === value()" />
  <formidable-field-option
    #optionRef
    [attr.id]="optionId(i)"
    [layout]="'radio-group'"
    [value]="option.value"
    [label]="option.label"
    [content]="option.template"
    [readonly]="option.readonly || readonly()"
    [disabled]="option.disabled || disabled()"
    [selected]="option.value === value()"
    [highlighted]="i === highlightedOptionIndex()" />
  } @empty {
  <div class="no-option">{{ noOptionsText() }}</div>
  }
</div>
