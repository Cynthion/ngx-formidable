<div
  #autocompleteRef
  class="field"
  [class.is-readonly]="readonly()"
  [class.is-disabled]="disabled()"
  [class.focused]="isFieldFocused()">
  <div class="input-wrapper">
    <!-- Input Field -->
    <input
      #inputRef
      type="text"
      autocomplete="off"
      role="combobox"
      class="wrapped-input"
      aria-autocomplete="list"
      [id]="fieldId"
      [placeholder]="placeholder()"
      [attr.name]="name()"
      [attr.readonly]="readonly() ? '' : null"
      [attr.disabled]="disabled() ? '' : null"
      [attr.tabindex]="readonly() || disabled() ? -1 : null"
      [attr.aria-required]="showRequiredMarker() || null"
      [attr.aria-invalid]="isInvalid || null"
      [attr.aria-describedby]="describedBy"
      [attr.aria-readonly]="readonly() || null"
      [attr.aria-expanded]="isPanelOpen()"
      [attr.aria-controls]="panelId"
      [attr.aria-activedescendant]="optionId(highlightedOptionIndex())"
      (input)="onInput($event)"
      (focus)="onFocusChange(true)"
      (blur)="onFocusChange(false)" />
  </div>

  <!-- Panel -->
  <div
    #panelRef
    tabindex="-1"
    class="panel panel-{{ panelPosition() }}"
    [class.open]="isPanelOpen()">
    <!-- The role sits here rather than on the panel, so the options it owns are its direct children. -->
    <div
      role="listbox"
      class="panel-scrollcontainer"
      [id]="panelId">
      <!-- Options -->
      <!-- Option components are re-created in order to control and filter them. -->
      @for (option of activeOptions(); track option.value; let i = $index) {
        <formidable-field-option
          #optionRef
          [attr.id]="optionId(i)"
          [value]="option.value"
          [label]="option.label"
          [match]="option.match"
          [readonly]="option.readonly || false"
          [disabled]="option.disabled || false"
          [selected]="option.value === value"
          [highlighted]="i === highlightedOptionIndex()">
          @if (option.template) {
            <ng-container [ngTemplateOutlet]="option.template"> </ng-container>
          } @else {
            {{ option.label || option.value }}
          }
        </formidable-field-option>
      } @empty {
        <!-- Plain text, not an option: a listbox must not offer its empty state as something to pick. -->
        <div class="no-option">{{ noOptionsText() }}</div>
      }
    </div>
  </div>
</div>
