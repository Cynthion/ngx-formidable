<select
  #selectRef
  class="field"
  [id]="fieldId"
  [attr.name]="name()"
  [attr.readonly]="readonly() ? '' : null"
  [attr.disabled]="disabled() ? '' : null"
  [attr.tabindex]="readonly() || disabled() ? -1 : null"
  [attr.aria-required]="showRequiredMarker() || null"
  [attr.aria-invalid]="isInvalid || null"
  [attr.aria-describedby]="describedBy"
  [attr.aria-readonly]="readonly() || null"
  (pointerdown)="readonly() || disabled() ? preventPointerDown($event) : null"
  (keydown)="readonly() || disabled() ? preventKeydown($event) : null"
  (change)="onSelectChanged()"
  (focus)="onFocusChange(true)"
  (blur)="onFocusChange(false)">
  <!-- Placeholder -->
  @if (placeholder() && !selectedValue()) {
    <option
      value=""
      disabled
      selected>
      {{ placeholder() }}
    </option>
  }

  <!-- Options -->
  <!-- Options are re-created in order to use native <option> elements. -->
  @for (option of activeOptions(); track option.value) {
    <option
      [value]="option.value"
      [disabled]="option.disabled || false"
      [selected]="option.value === selectedValue()">
      {{ option.label || option.value }}
    </option>
  } @empty {
    <option
      [value]=""
      [label]="noOptionsText()"
      [disabled]="true">
      {{ noOptionsText() }}
    </option>
  }
</select>

<!-- Toggle -->
<!-- Overlays the select rather than sitting beside it, so a click on the arrow still opens the platform's
     list. Same markup as the wrapper fields' toggle, minus the open state, which a `<select>` never reports. -->
@if (!readonly() && !disabled()) {
  <span class="toggle arrow-down"></span>
}
