<select
  #selectRef
  class="field"
  [id]="fieldId"
  [attr.name]="name()"
  [attr.readonly]="readonly() ? '' : null"
  [attr.disabled]="disabled() ? '' : null"
  [attr.tabindex]="canEdit() ? null : -1"
  [attr.aria-required]="required() || null"
  [attr.aria-invalid]="showErrors() || null"
  [attr.aria-describedby]="describedBy"
  [attr.aria-readonly]="readonly() || null"
  (pointerdown)="preventPointerDown($event)"
  (keydown)="preventKeydown($event)"
  (change)="onSelectChanged()"
  (focus)="onFocusChange(true)"
  (blur)="onFocusChange(false)">
  <!-- No Selection -->
  <!-- Selected whenever no option carries the value, so the platform never puts its first option in the
       value's place. Shows the placeholder, or nothing. -->
  @if (!selectedOption()) {
  <option
    value=""
    disabled
    selected>
    {{ placeholder() }}
  </option>
  }

  <!-- Options -->
  <!-- Options are re-created in order to use native <option> elements. -->
  @for (option of activeOptions(); track option.value) {
  <option
    [value]="option.value"
    [disabled]="option.disabled || false"
    [selected]="option.value === value()">
    {{ option.label || option.value }}
  </option>
  } @empty {
  <option
    [value]=""
    [label]="noOptionsText()"
    [disabled]="true">
    {{ noOptionsText() }}
  </option>
  }
</select>

<!-- Toggle -->
<!-- Overlays the select rather than sitting beside it, so a click on the arrow still opens the platform's
     list. Same markup as the wrapper fields' toggle, minus the open state, which a `<select>` never reports. -->
@if (canEdit()) {
<span class="toggle arrow-down"></span>
}
