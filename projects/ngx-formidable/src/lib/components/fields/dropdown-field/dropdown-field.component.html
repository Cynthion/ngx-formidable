<div
  #dropdownRef
  class="field"
  [class.is-readonly]="readonly"
  [class.is-disabled]="disabled"
  [class.focused]="isFieldFocused">
  <div
    class="input-wrapper"
    (mousedown)="!readonly && !disabled ? toggleMouseDown($event) : null"
    (pointerdown)="readonly || disabled ? preventPointerDown($event) : null"
    (keydown)="readonly || disabled ? preventKeydown($event) : null">
    <!-- Input Field -->
    <input
      #inputRef
      type="text"
      autocomplete="off"
      role="combobox"
      class="wrapped-input"
      [id]="fieldId"
      [placeholder]="placeholder"
      [value]="selectedOption?.label ?? null"
      [attr.name]="name"
      [attr.readonly]="true"
      [attr.disabled]="disabled ? '' : null"
      [attr.tabindex]="readonly || disabled ? -1 : null"
      [attr.aria-required]="showRequiredMarker || null"
      [attr.aria-invalid]="isInvalid || null"
      [attr.aria-describedby]="describedBy"
      [attr.aria-readonly]="readonly || null"
      [attr.aria-expanded]="isPanelOpen"
      [attr.aria-controls]="panelId"
      [attr.aria-activedescendant]="optionId((highlightedOptionIndex$ | async) ?? -1)"
      (keydown)="onTypeaheadKeydown($event)"
      (focus)="onFocusChange(true)"
      (blur)="onFocusChange(false)" />

    <!-- Toggle -->
    @if (!readonly && !disabled) {
      <span
        #toggleRef
        class="dropdown-toggle"
        [class.open]="isPanelOpen"
        [class.arrow-down]="!isPanelOpen"
        [class.arrow-up]="isPanelOpen">
      </span>
    }
  </div>

  <!-- Panel -->
  <div
    #panelRef
    tabindex="-1"
    class="panel panel-{{ panelPosition }}"
    [class.open]="isPanelOpen"
    (mousedown)="panelMouseDown($event)">
    <!-- The role sits here rather than on the panel, so the options it owns are its direct children. -->
    <div
      role="listbox"
      class="panel-scrollcontainer"
      [id]="panelId">
      <!-- Options -->
      <!-- Option components are re-created in order to control them. -->
      @for (option of options$ | async; track option.value; let i = $index) {
        <formidable-field-option
          #optionRef
          [attr.id]="optionId(i)"
          [value]="option.value"
          [label]="option.label"
          [readonly]="option.readonly || false"
          [disabled]="option.disabled || false"
          [selected]="option.value === value"
          [highlighted]="i === (highlightedOptionIndex$ | async)">
          @if (option.template) {
            <ng-container [ngTemplateOutlet]="option.template"> </ng-container>
          } @else {
            {{ option.label || option.value }}
          }
        </formidable-field-option>
      } @empty {
        <!-- Plain text, not an option: a listbox must not offer its empty state as something to pick. -->
        <div class="no-option">{{ noOptionsText }}</div>
      }
    </div>
  </div>
</div>
