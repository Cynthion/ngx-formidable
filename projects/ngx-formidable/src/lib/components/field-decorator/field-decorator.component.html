<!-- Before -->
@if (decoratorLayout !== 'inline') {
  <div
    class="before-wrapper"
    [class.hidden]="!showsBeforeWrapper">
    <ng-container [ngTemplateOutlet]="labelTooltip" />
  </div>
}

<!-- Layout -->
<div
  ngClass="container-{{ decoratorLayout }}"
  [class.value-top]="valueAlignment === 'top'">
  @if (decoratorLayout === 'inline') {
    <div class="inline-wrapper">
      <!-- Label & Tooltip -->
      <ng-container [ngTemplateOutlet]="labelTooltip" />

      <div class="inline-prefix-content-suffix-wrapper">
        <!-- Prefix -->
        <ng-container [ngTemplateOutlet]="prefix" />

        <!-- Content -->
        <ng-container [ngTemplateOutlet]="content" />

        <!-- Suffix -->
        <ng-container [ngTemplateOutlet]="suffix" />
      </div>
    </div>
  } @else {
    <!-- Label, when it renders over the field: this container is its positioning context -->
    @if (isLabelOverField) {
      <ng-container [ngTemplateOutlet]="label" />
    }

    <!-- Prefix -->
    <ng-container [ngTemplateOutlet]="prefix" />

    <!-- Content -->
    <ng-container [ngTemplateOutlet]="content" />

    <!-- Suffix -->
    <ng-container [ngTemplateOutlet]="suffix" />
  }
</div>

<!-- Validation errors, rendered here by `FieldErrorsDirective`. -->
<ng-container #errorsSlot />

<!-- Label & Tooltip Template -->
<!-- The label is only here while it renders in normal flow; over the field it lives in the container above,
     so exactly one of the two outlets exists and the single `ng-content` below still projects once. -->
<ng-template #labelTooltip>
  <div class="label-tooltip-wrapper">
    <!-- Label -->
    @if (!isLabelOverField) {
      <ng-container [ngTemplateOutlet]="label" />
    }
    <!-- Tooltip -->
    <ng-container [ngTemplateOutlet]="tooltip" />
  </div>
</ng-template>

<!-- Label Template -->
<ng-template #label>
  @if (decoratorLayout === 'vertical') {
    <div
      ngClass="label-wrapper label-{{ labelState }}"
      [class.hidden]="!hasLabel">
      <ng-container [ngTemplateOutlet]="projectedLabel" />
    </div>
  } @else {
    <label
      ngClass="label-wrapper label-{{ labelState }}"
      [class.hidden]="!hasLabel"
      [attr.for]="fieldId">
      <ng-container [ngTemplateOutlet]="projectedLabel" />
    </label>
  }

  <ng-template #projectedLabel>
    <ng-content select="[formidableFieldLabel]" />
  </ng-template>
</ng-template>

<!-- Tooltip Template -->
<ng-template #tooltip>
  <div
    class="tooltip-wrapper"
    [class.hidden]="!hasTooltip">
    <ng-content select="[formidableFieldTooltip]"></ng-content>
  </div>
</ng-template>

<!-- Content Template -->
<ng-template #content>
  @if (decoratorLayout === 'vertical') {
    <fieldset class="fieldset">
      <legend class="legend">{{ name }}</legend>

      <ng-container [ngTemplateOutlet]="projectedContent" />
    </fieldset>
  } @else {
    <ng-container [ngTemplateOutlet]="projectedContent" />
  }
</ng-template>

<!-- Prefix Template -->
<ng-template #prefix>
  <div
    #prefixWrapperRef
    ngClass="prefix-wrapper-{{ decoratorLayout }}"
    [class.hidden]="!hasPrefix">
    <ng-content select="[formidableFieldPrefix]"></ng-content>
  </div>
</ng-template>

<!-- Suffix Template -->
<ng-template #suffix>
  <div
    #suffixWrapperRef
    ngClass="suffix-wrapper-{{ decoratorLayout }}"
    [class.hidden]="!hasSuffix">
    <ng-content select="[formidableFieldSuffix]" />
  </div>
</ng-template>

<!-- Projected Content Template -->
<ng-template #projectedContent>
  <ng-content />
</ng-template>
